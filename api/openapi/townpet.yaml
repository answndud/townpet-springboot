openapi: 3.1.0
info:
  title: TownPet API
  version: 1.0.0
  description: Contract-first HTTP API for the TownPet community platform.
servers:
  - url: /
    description: Same-origin deployment
tags:
  - name: Auth
  - name: Catalog
  - name: Members
  - name: Feed
  - name: Publications
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [Auth]
      summary: Get the browser CSRF token
      responses:
        '200':
          description: CSRF token for state-changing browser requests
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
  /api/v1/auth/sessions:
    post:
      operationId: createSession
      tags: [Auth]
      summary: Create a Credentials browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/sessions/current:
    delete:
      operationId: deleteCurrentSession
      tags: [Auth]
      summary: Revoke the current session
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/password-resets:
    post:
      operationId: requestPasswordReset
      tags: [Auth]
      summary: Request a password reset without revealing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Request accepted whether or not the account exists
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/password-resets/confirmations:
    post:
      operationId: confirmPasswordReset
      tags: [Auth]
      summary: Consume a reset token and revoke the member sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmation'
      responses:
        '204':
          description: Password reset and sessions revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/email-verifications:
    post:
      operationId: requestEmailVerification
      tags: [Auth]
      summary: Request email verification without revealing account state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        '202':
          description: Request accepted whether or not verification is required
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/email-verifications/confirmations:
    post:
      operationId: confirmEmailVerification
      tags: [Auth]
      summary: Consume an email verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmation'
      responses:
        '204':
          description: Email verified
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/feed:
    get:
      operationId: getFeed
      tags: [Feed]
      summary: Read a cursor-paginated feed
      parameters:
        - name: audience
          in: query
          required: false
          schema:
            type: string
            enum: [GLOBAL, VIEWER]
            default: VIEWER
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/catalog/neighborhoods:
    get:
      operationId: listNeighborhoods
      tags: [Catalog]
      summary: List available neighborhoods
      responses:
        '200':
          description: Neighborhood catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Neighborhood'
  /api/v1/members/me:
    get:
      operationId: getCurrentMember
      tags: [Members]
      summary: Read the current member profile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/members/me/onboarding:
    put:
      operationId: updateMemberOnboarding
      tags: [Members]
      summary: Set the current member neighborhood
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/publications:
    post:
      operationId: createPublication
      tags: [Publications]
      summary: Create a publication
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicationRequest'
      responses:
        '201':
          description: Publication created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/publications/{publicationId}:
    get:
      operationId: getPublication
      tags: [Publications]
      summary: Read a publication
      parameters:
        - $ref: '#/components/parameters/PublicationId'
      responses:
        '200':
          description: Publication detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: editPublication
      tags: [Publications]
      summary: Edit an owned active publication
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PublicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditPublicationRequest'
      responses:
        '200':
          description: Publication edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deletePublication
      tags: [Publications]
      summary: Delete an owned active publication
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PublicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletePublicationRequest'
      responses:
        '204':
          description: Publication deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/publications/{publicationId}/restore:
    post:
      operationId: restorePublication
      tags: [Publications]
      summary: Restore an owned deleted publication
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PublicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestorePublicationRequest'
      responses:
        '200':
          description: Publication restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/media/uploads:
    post:
      operationId: createMediaUpload
      tags: [Media]
      summary: Create an owned upload asset metadata row
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaUploadRequest'
      responses:
        '200':
          description: Upload metadata created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/media/uploads/{assetId}/finalize:
    post:
      operationId: finalizeMediaUpload
      tags: [Media]
      summary: Finalize an owned upload after object verification
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeMediaUploadRequest'
      responses:
        '200':
          description: Upload finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/media/uploads/{assetId}/attachments/publications/{publicationId}:
    post:
      operationId: attachMediaToPublication
      tags: [Media]
      summary: Attach a finalized owned asset to an active owned publication
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/PublicationId'
      responses:
        '200':
          description: Media attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/publications/{publicationId}/comments:
    get:
      operationId: listPublicationComments
      tags: [Engagement]
      summary: List active comments for an active publication
      parameters:
        - $ref: '#/components/parameters/PublicationId'
      responses:
        '200':
          description: Comments in stable creation order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createPublicationComment
      tags: [Engagement]
      summary: Create a member comment
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PublicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/publications/{publicationId}/comments/{commentId}:
    delete:
      operationId: deletePublicationComment
      tags: [Engagement]
      summary: Delete an owned active comment
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PublicationId'
        - name: commentId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteCommentRequest'
      responses:
        '204':
          description: Comment deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/publications/{publicationId}/reaction:
    get:
      operationId: getPublicationReaction
      tags: [Engagement]
      summary: Read the publication reaction state and count
      parameters:
        - $ref: '#/components/parameters/PublicationId'
      responses:
        '200':
          description: Reaction state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reaction'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: setPublicationReaction
      tags: [Engagement]
      summary: Set or clear the current member reaction
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PublicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetReactionRequest'
      responses:
        '200':
          description: Updated reaction state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/publications/{publicationId}/bookmark:
    get:
      tags: [Engagement]
      summary: Read the current member bookmark state
      operationId: getPublicationBookmark
      parameters:
        - $ref: '#/components/parameters/PublicationId'
      responses:
        '200':
          description: Bookmark state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Engagement]
      summary: Set or clear the current member bookmark
      operationId: setPublicationBookmark
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PublicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBookmarkRequest'
      responses:
        '200':
          description: Updated bookmark state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/members/{targetMemberId}/relationship:
    get:
      operationId: getMemberRelationship
      tags: [Relationship]
      summary: Read the current member relationship state
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TargetMemberId'
      responses:
        '200':
          description: Relationship state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: setMemberRelationship
      tags: [Relationship]
      summary: Set follow or block state for another member
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TargetMemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRelationshipRequest'
      responses:
        '200':
          description: Updated relationship state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 20
    TargetMemberId:
      name: targetMemberId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 128
  schemas:
    Uuid:
      type: string
      format: uuid
    Instant:
      type: string
      format: date-time
    CreateSessionRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    SessionResponse:
      type: object
      required: [memberId, expiresAt]
      properties:
        memberId:
          $ref: '#/components/schemas/Uuid'
        expiresAt:
          $ref: '#/components/schemas/Instant'
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    PasswordResetConfirmation:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
        newPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 72
    EmailVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    EmailVerificationConfirmation:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
    Neighborhood:
      type: object
      required: [id, slug, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
        name:
          type: string
    Member:
      type: object
      required: [id, nickname, pets]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nickname:
          type: string
        bio:
          type: [string, 'null']
        neighborhoodId:
          type: [string, 'null']
          format: uuid
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
    OnboardingRequest:
      type: object
      required: [neighborhoodId]
      properties:
        bio:
          type: string
          maxLength: 500
        neighborhoodId:
          $ref: '#/components/schemas/Uuid'
        pets:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PetRequest'
    PetRequest:
      type: object
      required: [name, species]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        species:
          type: string
          minLength: 1
          maxLength: 20
    Pet:
      type: object
      required: [id, name, species]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        species:
          type: string
    CreatePublicationRequest:
      type: object
      required: [title, body, scope]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          minLength: 1
          maxLength: 20000
        scope:
          type: string
          enum: [LOCAL, GLOBAL]
        neighborhoodId:
          type: [string, 'null']
          format: uuid
    EditPublicationRequest:
      type: object
      required: [title, body, scope, version]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          minLength: 1
          maxLength: 20000
        scope:
          type: string
          enum: [LOCAL, GLOBAL]
        neighborhoodId:
          type: [string, 'null']
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
    DeletePublicationRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
    RestorePublicationRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
    CreateMediaUploadRequest:
      type: object
      required: [checksumSha256, contentType, byteSize]
      properties:
        checksumSha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        contentType:
          type: string
          maxLength: 120
        byteSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
    FinalizeMediaUploadRequest:
      type: object
      required: [checksumSha256]
      properties:
        checksumSha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
    MediaUpload:
      type: object
      required: [id, uploadUrl, objectKey, checksumSha256, contentType, byteSize, status, expiresAt, version]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        uploadUrl:
          type: string
          format: uri
        objectKey:
          type: string
        checksumSha256:
          type: string
        contentType:
          type: string
        byteSize:
          type: integer
          format: int64
        status:
          type: string
          enum: [UPLOADING, READY, ATTACHED, ABANDONED]
        publicationId:
          type: [string, 'null']
          format: uuid
        expiresAt:
          $ref: '#/components/schemas/Instant'
        version:
          type: integer
          format: int64
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
    DeleteCommentRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
    Comment:
      type: object
      required: [id, publicationId, authorId, body, lifecycle, createdAt, updatedAt, version]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        publicationId:
          $ref: '#/components/schemas/Uuid'
        authorId:
          $ref: '#/components/schemas/Uuid'
        body:
          type: string
        lifecycle:
          type: string
          enum: [ACTIVE, DELETED]
        createdAt:
          $ref: '#/components/schemas/Instant'
        updatedAt:
          $ref: '#/components/schemas/Instant'
        version:
          type: integer
          format: int64
          minimum: 0
    CommentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    SetReactionRequest:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
    Reaction:
      type: object
      required: [active, count]
      properties:
        active:
          type: boolean
        count:
          type: integer
          format: int64
          minimum: 0
    SetBookmarkRequest:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
    Bookmark:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
    SetRelationshipRequest:
      type: object
      required: [following, blocking]
      properties:
        following:
          type: boolean
        blocking:
          type: boolean
    Relationship:
      type: object
      required: [following, blocking]
      properties:
        following:
          type: boolean
        blocking:
          type: boolean
    Publication:
      type: object
      required: [id, type, title, body, scope, authorId, lifecycle, createdAt, updatedAt, version]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          enum: [FREE_BOARD]
        title:
          type: string
        body:
          type: string
        scope:
          type: string
          enum: [LOCAL, GLOBAL]
        authorId:
          $ref: '#/components/schemas/Uuid'
        neighborhoodId:
          type: [string, 'null']
          format: uuid
        lifecycle:
          type: string
          enum: [ACTIVE, DELETED]
        createdAt:
          $ref: '#/components/schemas/Instant'
        updatedAt:
          $ref: '#/components/schemas/Instant'
        version:
          type: integer
          format: int64
          minimum: 0
    PageInfo:
      type: object
      required: [hasNext]
      properties:
        nextCursor:
          type: [string, 'null']
        hasNext:
          type: boolean
    FeedPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Publication'
        page:
          $ref: '#/components/schemas/PageInfo'
    ProblemDetail:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Authenticated actor is not allowed to perform this action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Concurrent or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
