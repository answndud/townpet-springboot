openapi: 3.1.0
info:
  title: TownPet API
  version: 1.0.0
  description: Contract-first HTTP API for the TownPet community platform.
servers:
  - url: /
    description: Same-origin deployment
tags:
  - name: Auth
  - name: Catalog
  - name: Members
  - name: Feed
  - name: Publications
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [Auth]
      summary: Get the browser CSRF token
      responses:
        '200':
          description: CSRF token for state-changing browser requests
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
  /api/v1/auth/sessions:
    post:
      operationId: createSession
      tags: [Auth]
      summary: Create a local development session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/sessions/current:
    delete:
      operationId: deleteCurrentSession
      tags: [Auth]
      summary: Revoke the current session
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/feed:
    get:
      operationId: getFeed
      tags: [Feed]
      summary: Read a cursor-paginated feed
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPage'
  /api/v1/catalog/neighborhoods:
    get:
      operationId: listNeighborhoods
      tags: [Catalog]
      summary: List available neighborhoods
      responses:
        '200':
          description: Neighborhood catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Neighborhood'
  /api/v1/members/me:
    get:
      operationId: getCurrentMember
      tags: [Members]
      summary: Read the current member profile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/members/me/onboarding:
    put:
      operationId: updateMemberOnboarding
      tags: [Members]
      summary: Set the current member neighborhood
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/publications:
    post:
      operationId: createPublication
      tags: [Publications]
      summary: Create a publication
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicationRequest'
      responses:
        '201':
          description: Publication created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: listPublications
      tags: [Publications]
      summary: List visible publications
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Publication page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationPage'
  /api/v1/publications/{publicationId}:
    get:
      operationId: getPublication
      tags: [Publications]
      summary: Read a publication
      parameters:
        - $ref: '#/components/parameters/PublicationId'
      responses:
        '200':
          description: Publication detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 20
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 128
  schemas:
    Uuid:
      type: string
      format: uuid
    Instant:
      type: string
      format: date-time
    CreateSessionRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    SessionResponse:
      type: object
      required: [memberId, expiresAt]
      properties:
        memberId:
          $ref: '#/components/schemas/Uuid'
        expiresAt:
          $ref: '#/components/schemas/Instant'
    Neighborhood:
      type: object
      required: [id, slug, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
        name:
          type: string
    Member:
      type: object
      required: [id, nickname]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nickname:
          type: string
        bio:
          type: [string, 'null']
        neighborhoodId:
          type: [string, 'null']
          format: uuid
    OnboardingRequest:
      type: object
      required: [neighborhoodId]
      properties:
        bio:
          type: string
          maxLength: 500
        neighborhoodId:
          $ref: '#/components/schemas/Uuid'
    CreatePublicationRequest:
      type: object
      required: [title, body, scope]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        body:
          type: string
          minLength: 1
          maxLength: 20000
        scope:
          type: string
          enum: [LOCAL, GLOBAL]
        neighborhoodId:
          type: [string, 'null']
          format: uuid
    Publication:
      type: object
      required: [id, title, body, scope, authorId, createdAt, version]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
        body:
          type: string
        scope:
          type: string
          enum: [LOCAL, GLOBAL]
        authorId:
          $ref: '#/components/schemas/Uuid'
        neighborhoodId:
          type: [string, 'null']
          format: uuid
        createdAt:
          $ref: '#/components/schemas/Instant'
        version:
          type: integer
          format: int64
          minimum: 0
    PageInfo:
      type: object
      required: [hasNext]
      properties:
        nextCursor:
          type: [string, 'null']
        hasNext:
          type: boolean
    FeedPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Publication'
        page:
          $ref: '#/components/schemas/PageInfo'
    PublicationPage:
      $ref: '#/components/schemas/FeedPage'
    ProblemDetail:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Concurrent or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
