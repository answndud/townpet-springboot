spring:
  datasource:
    url: jdbc:h2:mem:townpet_smoke;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  session:
    jdbc:
      initialize-schema: always
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
  jpa:
    hibernate:
      ddl-auto: none

management:
  endpoint:
    health:
      show-details: always
