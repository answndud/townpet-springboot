spring:
  session:
    # Local showcase sessions should survive a long manual review session.
    # Production keeps the shorter application default unless configured separately.
    timeout: 8h
  datasource:
    url: ${TOWNPET_DB_URL:jdbc:postgresql://localhost:54329/townpet}
    username: ${TOWNPET_DB_USERNAME:townpet_app}
    password: ${TOWNPET_DB_PASSWORD:townpet_local_dev}

townpet:
  demo-data:
    enabled: true
  media:
    local-root: ./.townpet/uploads
  email:
    enabled: false
