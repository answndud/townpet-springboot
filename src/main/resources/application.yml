spring:
  application:
    name: townpet-springboot
  main:
    banner-mode: "off"
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${TOWNPET_DB_URL}
    username: ${TOWNPET_DB_USERNAME}
    password: ${TOWNPET_DB_PASSWORD}
    hikari:
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  lifecycle:
    timeout-per-shutdown-phase: 20s

logging:
  pattern:
    level: "%5p [traceId=%X{traceId}]"
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: db

townpet:
  email:
    enabled: ${TOWNPET_EMAIL_ENABLED:false}
    from: ${TOWNPET_EMAIL_FROM:no-reply@townpet.local}
    public-base-url: ${TOWNPET_PUBLIC_BASE_URL:http://localhost:5173}
    token-encryption-key: ${TOWNPET_EMAIL_TOKEN_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  media:
    minio:
      endpoint: ${TOWNPET_MINIO_ENDPOINT:http://localhost:9000}
      public-endpoint: ${TOWNPET_MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
      access-key: ${TOWNPET_MINIO_ACCESS_KEY}
      secret-key: ${TOWNPET_MINIO_SECRET_KEY}
      bucket: ${TOWNPET_MINIO_BUCKET:townpet-media}
      presign-expiry-seconds: ${TOWNPET_MINIO_PRESIGN_EXPIRY_SECONDS:900}
  security:
    secure-cookies: ${TOWNPET_SECURE_COOKIES:false}
    search-event-retention: ${TOWNPET_SEARCH_EVENT_RETENTION:30d}
    search-event-cleanup-ms: ${TOWNPET_SEARCH_EVENT_CLEANUP_MS:3600000}
  demo-data:
    enabled: ${TOWNPET_DEMO_DATA_ENABLED:false}
  build:
    version: ${TOWNPET_BUILD_VERSION:0.1.0-SNAPSHOT}
