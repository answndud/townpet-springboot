spring:
  application:
    name: townpet-springboot
  main:
    banner-mode: "off"
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${TOWNPET_DB_URL}
    username: ${TOWNPET_DB_USERNAME}
    password: ${TOWNPET_DB_PASSWORD}
    hikari:
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  lifecycle:
    timeout-per-shutdown-phase: 20s

logging:
  pattern:
    level: "%5p [traceId=%X{traceId}]"

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: db

townpet:
  security:
    secure-cookies: ${TOWNPET_SECURE_COOKIES:false}
  demo-data:
    enabled: ${TOWNPET_DEMO_DATA_ENABLED:false}
  build:
    version: "0.1.0-SNAPSHOT"
