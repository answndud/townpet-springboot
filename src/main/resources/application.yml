spring:
  application:
    name: townpet-springboot
  main:
    banner-mode: "off"
  jackson:
    time-zone: UTC
  datasource:
    url: ${TOWNPET_DB_URL:jdbc:postgresql://localhost:54329/townpet}
    username: ${TOWNPET_DB_USERNAME:townpet_app}
    password: ${TOWNPET_DB_PASSWORD:townpet_local_dev}
    hikari:
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

townpet:
  demo-data:
    enabled: ${TOWNPET_DEMO_DATA_ENABLED:true}
  build:
    version: "0.1.0-SNAPSHOT"
