server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

spring:
  session:
    jdbc:
      initialize-schema: never

townpet:
  security:
    secure-cookies: true
  demo-data:
    enabled: ${TOWNPET_DEMO_DATA_ENABLED:false}
