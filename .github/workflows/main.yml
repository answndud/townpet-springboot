name: Main quality and smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Full quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: gradle/actions/setup-gradle@v4
      - run: corepack enable
      - run: ./scripts/validate-release-candidate.sh
      - run: ./gradlew check --no-daemon
      - run: corepack pnpm install --frozen-lockfile
        working-directory: frontend
      - run: corepack pnpm typecheck && corepack pnpm test && corepack pnpm build
        working-directory: frontend

  browser-smoke:
    name: Browser shell and Credentials
    # Keep the expensive browser/Docker smoke suite available on demand,
    # without making every push wait for an environment-dependent run.
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: frontend
      - run: corepack pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: corepack pnpm test:e2e -- --project=chromium
        working-directory: frontend
      - run: corepack pnpm -C frontend test:e2e:auth
