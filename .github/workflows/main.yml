name: Main quality and smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Full quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: corepack enable
      - run: ./scripts/validate-release-candidate.sh
      - run: ./gradlew check --no-daemon
      - run: corepack pnpm install --frozen-lockfile
        working-directory: frontend
      - run: corepack pnpm typecheck && corepack pnpm test && corepack pnpm build
        working-directory: frontend

  browser-smoke:
    name: Browser shell and Credentials
    # Keep the expensive browser/Docker smoke suite available on demand,
    # without making every push wait for an environment-dependent run.
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: frontend
      - run: corepack pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: corepack pnpm test:e2e -- --project=chromium
        working-directory: frontend
      - run: corepack pnpm -C frontend test:e2e:auth
