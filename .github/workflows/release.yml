name: Release and deploy

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run that published the promotion manifest
        required: true
        type: string
      deploy:
        description: Deploy the published images to netcup
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate-ref:
    name: Validate release ref
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::release must be run from main; selected ref is $GITHUB_REF"
            exit 1
          }

  source:
    name: Load tested image manifest
    needs: validate-ref
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.manifest.outputs.backend_image }}
      web_image: ${{ steps.manifest.outputs.web_image }}
      source_sha: ${{ steps.manifest.outputs.source_sha }}
    steps:
      - name: Validate source CI run
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          run_json="$(gh run view "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,headBranch,headSha,status,conclusion,event)"
          test "$(jq -r '.workflowName' <<<"$run_json")" = "Continuous integration"
          test "$(jq -r '.headBranch' <<<"$run_json")" = "main"
          test "$(jq -r '.status' <<<"$run_json")" = "completed"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -r '.event' <<<"$run_json")" = "push"
      - name: Download promotion manifest
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-images"
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name townpet-release-images --dir "$RUNNER_TEMP/release-images"
      - name: Validate promotion manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          manifest="$RUNNER_TEMP/release-images/images.env"
          test -f "$manifest"
          source_sha="$(sed -n 's/^source_sha=//p' "$manifest")"
          backend_image="$(sed -n 's/^backend_image=//p' "$manifest")"
          web_image="$(sed -n 's/^web_image=//p' "$manifest")"
          test "$source_sha" = "$(gh run view "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          [[ "$backend_image" =~ ^ghcr\.io/[^/]+/townpet-backend@sha256:[0-9a-f]{64}$ ]]
          [[ "$web_image" =~ ^ghcr\.io/[^/]+/townpet-web@sha256:[0-9a-f]{64}$ ]]
          {
            printf 'backend_image=%s\n' "$backend_image"
            printf 'web_image=%s\n' "$web_image"
            printf 'source_sha=%s\n' "$source_sha"
          } >> "$GITHUB_OUTPUT"

  deploy-netcup:
    name: Deploy published images to netcup
    if: inputs.deploy == true
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate deploy secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          DEPLOY_SMOKE_URL: ${{ secrets.DEPLOY_SMOKE_URL }}
        run: |
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER DEPLOY_PATH GHCR_USERNAME GHCR_READ_TOKEN DEPLOY_SMOKE_URL; do
            test -n "${!name}" || { echo "::error::$name is missing"; exit 1; }
          done
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Sync netcup assets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/deploy/compose'"
          scp deploy/compose/netcup.yml deploy/compose/edge.yml deploy/compose/Caddyfile.netcup \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/compose/"
          scp deploy/nginx.conf.template \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/"
          scp deploy/deploy-netcup.sh deploy/grant-runtime-db-role.sh deploy/backup-portfolio.sh deploy/restore-portfolio.sh deploy/encrypt-backup.sh deploy/prune-portfolio-backups.sh deploy/workload-budget-check.sh deploy/edge.env.example scripts/validate-edge-env.sh scripts/validate-portfolio-env.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/"
      - name: Pull and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          BACKEND_IMAGE: ${{ needs.source.outputs.backend_image }}
          WEB_IMAGE: ${{ needs.source.outputs.web_image }}
          SMOKE_URL: ${{ secrets.DEPLOY_SMOKE_URL }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin && \
             cd '$DEPLOY_PATH' && chmod 700 deploy/deploy-netcup.sh deploy/grant-runtime-db-role.sh deploy/backup-portfolio.sh deploy/restore-portfolio.sh deploy/encrypt-backup.sh deploy/prune-portfolio-backups.sh deploy/workload-budget-check.sh deploy/validate-edge-env.sh deploy/validate-portfolio-env.sh && \
             TOWNPET_BACKEND_IMAGE='$BACKEND_IMAGE' TOWNPET_WEB_IMAGE='$WEB_IMAGE' TOWNPET_BUILD_VERSION='${{ needs.source.outputs.source_sha }}' \
             DEPLOYMENT_ID='github-${{ github.run_id }}-${{ github.sha }}' \
             COMPOSE_FILE=deploy/compose/netcup.yml EDGE_COMPOSE_FILE=deploy/compose/edge.yml \
             COMPOSE_ENV_FILE=/opt/townpet/secrets/portfolio.env \
             EDGE_ENV_FILE=/opt/edge/secrets/edge.env \
             DEPLOY_LOCK_FILE=/tmp/portfolio-deploy.lock \
             EDGE_ENV_VALIDATOR=deploy/validate-edge-env.sh \
             TOWNPET_ENV_VALIDATOR=deploy/validate-portfolio-env.sh deploy/deploy-netcup.sh"
