name: Release and deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the published images to netcup
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate-ref:
    name: Validate release ref
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::release must be run from main; selected ref is $GITHUB_REF"
            exit 1
          }

  publish:
    name: Publish amd64 images
    needs: validate-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: backend-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/townpet-backend
          tags: type=sha,format=long
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: web-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/townpet-web
          tags: type=sha,format=long
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}

  deploy-netcup:
    name: Deploy published images to netcup
    if: inputs.deploy == true
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate deploy secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER DEPLOY_PATH GHCR_USERNAME GHCR_READ_TOKEN; do
            test -n "${!name}" || { echo "::error::$name is missing"; exit 1; }
          done
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Sync netcup assets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/deploy/compose'"
          scp deploy/compose/netcup.yml deploy/compose/edge.yml deploy/compose/Caddyfile.netcup \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/compose/"
          scp deploy/nginx.conf.template \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/"
          scp deploy/deploy-netcup.sh deploy/grant-runtime-db-role.sh deploy/backup-portfolio.sh deploy/restore-portfolio.sh deploy/encrypt-backup.sh deploy/workload-budget-check.sh deploy/edge.env.example scripts/validate-edge-env.sh scripts/validate-portfolio-env.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/"
      - name: Pull and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/townpet-backend:sha-${{ github.sha }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/townpet-web:sha-${{ github.sha }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin && \
             cd '$DEPLOY_PATH' && chmod 700 deploy/deploy-netcup.sh deploy/grant-runtime-db-role.sh deploy/backup-portfolio.sh deploy/restore-portfolio.sh deploy/encrypt-backup.sh deploy/workload-budget-check.sh deploy/validate-edge-env.sh deploy/validate-portfolio-env.sh && \
             TOWNPET_BACKEND_IMAGE='$BACKEND_IMAGE' TOWNPET_WEB_IMAGE='$WEB_IMAGE' TOWNPET_BUILD_VERSION='${{ github.sha }}' \
             COMPOSE_FILE=deploy/compose/netcup.yml EDGE_COMPOSE_FILE=deploy/compose/edge.yml \
             COMPOSE_ENV_FILE=/opt/townpet/secrets/portfolio.env \
             EDGE_ENV_FILE=/opt/edge/secrets/edge.env \
             DEPLOY_LOCK_FILE=/tmp/portfolio-deploy.lock \
             EDGE_ENV_VALIDATOR=deploy/validate-edge-env.sh \
             TOWNPET_ENV_VALIDATOR=deploy/validate-portfolio-env.sh deploy/deploy-netcup.sh"
