name: PR quality gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # PRs check only fast fixture/script metadata. The full parity audit
      # remains for the main/manual release gate.
      - run: sh scripts/validate-pr-metadata.sh
      # `check` also runs every SpringBoot/Testcontainers suite, JaCoCo and
      # coverage verification. Those are retained for main/manual gates.
      # PRs run compilation plus focused, in-process regression tests instead.
      - name: Compile and run focused backend tests
        run: >-
          ./gradlew test --no-daemon
          --tests com.townpet.architecture.LayerRulesTest
          --tests com.townpet.architecture.ModularityTest
          --tests com.townpet.common.BuildInfoContributorTest
          --tests com.townpet.common.ClientAddressTest
          --tests com.townpet.common.RequestRateLimiterTest
          --tests com.townpet.common.UuidV7Test
          --tests com.townpet.common.web.GlobalProblemHandlerTest
          --tests com.townpet.common.web.RequestTraceFilterTest
          --tests com.townpet.discovery.SearchEventCleanupTest
          --tests com.townpet.engagement.GuestCommentRateLimitTest
          --tests com.townpet.media.MediaImageDimensionsTest
          --tests com.townpet.operations.PublicIngressRateLimiterTest
          --tests com.townpet.publication.GuestPublicationRateLimitTest

  frontend:
    name: Frontend type, unit, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build
