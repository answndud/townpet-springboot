services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:?set MIGRATION_DB_USER}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?set MIGRATION_DB_PASSWORD}
    volumes:
      - p5-vps-postgres-data:/var/lib/postgresql
      - ./init/portfolio:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${TOWNPET_MINIO_ROOT_ACCESS_KEY:?set TOWNPET_MINIO_ROOT_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${TOWNPET_MINIO_ROOT_SECRET_KEY:?set TOWNPET_MINIO_ROOT_SECRET_KEY}
    volumes:
      - p5-vps-minio-data:/data
    ports:
      - "19000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      MINIO_ROOT_ACCESS_KEY: ${TOWNPET_MINIO_ROOT_ACCESS_KEY:?set TOWNPET_MINIO_ROOT_ACCESS_KEY}
      MINIO_ROOT_SECRET_KEY: ${TOWNPET_MINIO_ROOT_SECRET_KEY:?set TOWNPET_MINIO_ROOT_SECRET_KEY}
      MINIO_APP_ACCESS_KEY: ${TOWNPET_MINIO_ACCESS_KEY:?set TOWNPET_MINIO_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${TOWNPET_MINIO_SECRET_KEY:?set TOWNPET_MINIO_SECRET_KEY}
      MINIO_BUCKET: ${TOWNPET_MINIO_BUCKET:-townpet-media}
    volumes:
      - ./minio-policy.json:/config/townpet-media-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_ACCESS_KEY" "$$MINIO_ROOT_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
        (mc admin policy info local townpet-media-app >/dev/null 2>&1 || mc admin policy create local townpet-media-app /config/townpet-media-policy.json) &&
        (mc admin user info local "$$MINIO_APP_ACCESS_KEY" >/dev/null 2>&1 || mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY") &&
        mc admin policy attach local townpet-media-app --user "$$MINIO_APP_ACCESS_KEY"

  backend:
    image: ${TOWNPET_BACKEND_IMAGE:?set TOWNPET_BACKEND_IMAGE}
    environment:
      SPRING_PROFILES_ACTIVE: production
      TOWNPET_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      TOWNPET_DB_USERNAME: ${APP_DB_USER:?set APP_DB_USER}
      TOWNPET_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      TOWNPET_MIGRATION_DB_USERNAME: ${MIGRATION_DB_USER:?set MIGRATION_DB_USER}
      TOWNPET_MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?set MIGRATION_DB_PASSWORD}
      SPRING_FLYWAY_USER: ${MIGRATION_DB_USER:?set MIGRATION_DB_USER}
      SPRING_FLYWAY_PASSWORD: ${MIGRATION_DB_PASSWORD:?set MIGRATION_DB_PASSWORD}
      TOWNPET_EMAIL_ENABLED: "false"
      TOWNPET_PUBLIC_BASE_URL: ${TOWNPET_PUBLIC_BASE_URL:?set TOWNPET_PUBLIC_BASE_URL}
      TOWNPET_EMAIL_TOKEN_ENCRYPTION_KEY: ${TOWNPET_EMAIL_TOKEN_ENCRYPTION_KEY:?set TOWNPET_EMAIL_TOKEN_ENCRYPTION_KEY}
      TOWNPET_TRUSTED_PROXY_CIDRS: ${TOWNPET_TRUSTED_PROXY_CIDRS:?set TOWNPET_TRUSTED_PROXY_CIDRS}
      TOWNPET_MINIO_ENDPOINT: http://minio:9000
      TOWNPET_MINIO_PUBLIC_ENDPOINT: ${TOWNPET_MINIO_PUBLIC_ENDPOINT:?set TOWNPET_MINIO_PUBLIC_ENDPOINT}
      TOWNPET_MINIO_ACCESS_KEY: ${TOWNPET_MINIO_ACCESS_KEY:?set TOWNPET_MINIO_ACCESS_KEY}
      TOWNPET_MINIO_SECRET_KEY: ${TOWNPET_MINIO_SECRET_KEY:?set TOWNPET_MINIO_SECRET_KEY}
      TOWNPET_MINIO_BUCKET: ${TOWNPET_MINIO_BUCKET:-townpet-media}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "18081:8080"
    healthcheck:
      # The historical image used for this rehearsal exposes the public
      # health contract but secures actuator readiness; production netcup
      # images use the readiness endpoint in netcup.yml.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q 'status'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  p5-vps-postgres-data:
  p5-vps-minio-data:
