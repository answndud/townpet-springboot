services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-townpet}
      POSTGRES_USER: ${POSTGRES_USER:-townpet_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init/portfolio:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${TOWNPET_MINIO_ROOT_ACCESS_KEY:?set TOWNPET_MINIO_ROOT_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${TOWNPET_MINIO_ROOT_SECRET_KEY:?set TOWNPET_MINIO_ROOT_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    environment:
      MINIO_ROOT_ACCESS_KEY: ${TOWNPET_MINIO_ROOT_ACCESS_KEY:?set TOWNPET_MINIO_ROOT_ACCESS_KEY}
      MINIO_ROOT_SECRET_KEY: ${TOWNPET_MINIO_ROOT_SECRET_KEY:?set TOWNPET_MINIO_ROOT_SECRET_KEY}
      MINIO_APP_ACCESS_KEY: ${TOWNPET_MINIO_ACCESS_KEY:?set TOWNPET_MINIO_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${TOWNPET_MINIO_SECRET_KEY:?set TOWNPET_MINIO_SECRET_KEY}
      MINIO_BUCKET: ${TOWNPET_MINIO_BUCKET:-townpet-media}
    volumes:
      - ./minio-policy.json:/config/townpet-media-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set local http://minio:9000 "$${MINIO_ROOT_ACCESS_KEY}" "$${MINIO_ROOT_SECRET_KEY}" &&
      mc mb --ignore-existing "local/$${MINIO_BUCKET}" &&
      sed "s/townpet-media/$${MINIO_BUCKET}/g" /config/townpet-media-policy.json > /tmp/townpet-media-policy.json &&
      (mc admin policy info local townpet-media-app >/dev/null 2>&1 || mc admin policy create local townpet-media-app /tmp/townpet-media-policy.json) &&
      (mc admin user info local "$${MINIO_APP_ACCESS_KEY}" >/dev/null 2>&1 || mc admin user add local "$${MINIO_APP_ACCESS_KEY}" "$${MINIO_APP_SECRET_KEY}") &&
      mc admin policy attach local townpet-media-app --user "$${MINIO_APP_ACCESS_KEY}"

  backend:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-townpet}
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER:?set APP_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      TOWNPET_DEMO_DATA_ENABLED: ${TOWNPET_DEMO_DATA_ENABLED:-false}
      TOWNPET_EMAIL_ENABLED: ${TOWNPET_EMAIL_ENABLED:?set TOWNPET_EMAIL_ENABLED}
      TOWNPET_EMAIL_FROM: ${TOWNPET_EMAIL_FROM:?set TOWNPET_EMAIL_FROM}
      TOWNPET_PUBLIC_BASE_URL: ${TOWNPET_PUBLIC_BASE_URL:?set TOWNPET_PUBLIC_BASE_URL}
      TOWNPET_EMAIL_TOKEN_ENCRYPTION_KEY: ${TOWNPET_EMAIL_TOKEN_ENCRYPTION_KEY:?set TOWNPET_EMAIL_TOKEN_ENCRYPTION_KEY}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?set SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?set SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?set SPRING_MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      TOWNPET_MINIO_ENDPOINT: http://minio:9000
      TOWNPET_MINIO_PUBLIC_ENDPOINT: ${TOWNPET_MINIO_PUBLIC_ENDPOINT:?set TOWNPET_MINIO_PUBLIC_ENDPOINT}
      TOWNPET_MINIO_ACCESS_KEY: ${TOWNPET_MINIO_ACCESS_KEY:?set TOWNPET_MINIO_ACCESS_KEY}
      TOWNPET_MINIO_SECRET_KEY: ${TOWNPET_MINIO_SECRET_KEY:?set TOWNPET_MINIO_SECRET_KEY}
      TOWNPET_MINIO_BUCKET: ${TOWNPET_MINIO_BUCKET:-townpet-media}
      TOWNPET_MINIO_PRESIGN_EXPIRY_SECONDS: ${TOWNPET_MINIO_PRESIGN_EXPIRY_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    environment:
      TOWNPET_DOMAIN: ${TOWNPET_DOMAIN:-:80}
      TOWNPET_MEDIA_DOMAIN: ${TOWNPET_MEDIA_DOMAIN:?set TOWNPET_MEDIA_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
