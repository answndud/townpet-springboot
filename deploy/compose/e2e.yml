services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: townpet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_e2e_admin
    ports:
      - "54330:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d townpet"]
      interval: 2s
      timeout: 5s
      retries: 30
